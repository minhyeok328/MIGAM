      required: [first_open_date, opens_at, closes_at, verified_at]
      properties:
        first_open_date:
          type: string
          format: date
        opens_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
        closes_at:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
        verified_at:
          type: string
          format: date-time
